<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOOM — Latveria Protocol</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #3cff72;
            --green-dark: #0c5223;
            --green-glow: #1bb94e;

            --metal: #c8cfcb;
            --metal-dark: #454b48;

            --black: #030504;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #102418 0%,
                    #07100a 35%,
                    #030504 72%,
                    #010201 100%
                );

            color: white;

            font-family:
                'Orbitron',
                'Arial Black',
                sans-serif;

            position: relative;
        }

        /* =========================================
           LATVERIA ATMOSPHERE
        ========================================= */

        .atmosphere {
            position: fixed;

            width: 750px;
            height: 750px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(60, 255, 114, 0.09),
                    transparent 65%
                );

            filter: blur(60px);

            pointer-events: none;
        }

        /* =========================================
           DOOM EMBLEM
        ========================================= */

        .emblem {
            position: absolute;

            width: 470px;
            height: 570px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            opacity: 0.08;

            border: 2px solid var(--green);

            clip-path: polygon(
                50% 0%,
                86% 12%,
                100% 42%,
                91% 75%,
                67% 94%,
                50% 100%,
                33% 94%,
                9% 75%,
                0% 42%,
                14% 12%
            );

            box-shadow:
                inset 0 0 80px rgba(60, 255, 114, 0.15),
                0 0 80px rgba(60, 255, 114, 0.08);

            pointer-events: none;
        }

        .emblem::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 230px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 2px solid var(--green);

            clip-path: polygon(
                50% 0%,
                90% 20%,
                100% 70%,
                50% 100%,
                0% 70%,
                10% 20%
            );
        }

        .emblem::after {
            content: "";

            position: absolute;

            width: 70px;
            height: 70px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border: 2px solid var(--green);

            border-radius: 50%;

            box-shadow:
                0 0 30px rgba(60, 255, 114, 0.2);
        }

        /* =========================================
           HUD FRAME
        ========================================= */

        .hud {
            position: fixed;

            inset: 35px;

            border:
                1px solid rgba(60, 255, 114, 0.07);

            pointer-events: none;
        }

        .hud::before,
        .hud::after {
            content: "";

            position: absolute;

            width: 70px;
            height: 2px;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);
        }

        .hud::before {
            top: -1px;
            left: -1px;
        }

        .hud::after {
            bottom: -1px;
            right: -1px;
        }

        /* =========================================
           CONTENT
        ========================================= */

        .content {
            position: relative;

            z-index: 5;

            display: flex;
            flex-direction: column;

            align-items: center;

            text-align: center;
        }

        .status {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 5px;

            color: #68736c;

            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px var(--green);

            animation: pulse 1.5s infinite;
        }

        /* =========================================
           TITLE
        ========================================= */

        .title {
            font-size: clamp(38px, 7vw, 82px);

            font-weight: 900;

            letter-spacing: 8px;

            color: var(--metal);

            text-transform: uppercase;

            text-shadow:
                0 1px 0 #ffffff,
                0 2px 0 #7b817e,
                0 4px 0 #353a38,
                0 0 18px rgba(60, 255, 114, 0.22);

            animation: titleBreath 5s ease-in-out infinite;
        }

        .title span {
            color: var(--green);

            text-shadow:
                0 0 8px rgba(60, 255, 114, 0.8),
                0 0 25px rgba(60, 255, 114, 0.4);
        }

        .subtitle {
            margin-top: 15px;

            font-size: 10px;

            font-weight: 500;

            letter-spacing: 6px;

            color: #707a74;

            text-transform: uppercase;
        }

        /* =========================================
           DIVIDER
        ========================================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 14px;

            margin: 28px 0 0;

            width: 430px;

            max-width: 80vw;
        }

        .divider span {
            height: 1px;

            flex: 1;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(60, 255, 114, 0.4)
                );
        }

        .divider span:last-child {
            background:
                linear-gradient(
                    90deg,
                    rgba(60, 255, 114, 0.4),
                    transparent
                );
        }

        .divider i {
            width: 7px;
            height: 7px;

            border: 1px solid var(--green);

            transform: rotate(45deg);

            box-shadow:
                0 0 10px rgba(60, 255, 114, 0.5);
        }

        /* =========================================
           TIMER
        ========================================= */

        .timer {
            display: flex;

            gap: 18px;

            margin-top: 30px;
        }

        .time-box {
            position: relative;

            min-width: 125px;

            padding: 22px 15px 17px;

            background:
                linear-gradient(
                    145deg,
                    rgba(100, 110, 105, 0.12),
                    rgba(3, 5, 4, 0.92)
                );

            border:
                1px solid rgba(150, 160, 155, 0.22);

            clip-path: polygon(
                9px 0,
                calc(100% - 9px) 0,
                100% 9px,
                100% calc(100% - 9px),
                calc(100% - 9px) 100%,
                9px 100%,
                0 calc(100% - 9px),
                0 9px
            );

            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.025),
                0 15px 45px rgba(0, 0, 0, 0.5);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-6px);

            border-color:
                rgba(60, 255, 114, 0.55);

            box-shadow:
                inset 0 0 30px rgba(60, 255, 114, 0.06),
                0 15px 45px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(60, 255, 114, 0.1);
        }

        /* Armor details */

        .time-box::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 38px;
            height: 2px;

            background: var(--green);

            box-shadow:
                0 0 9px var(--green);
        }

        .time-box::after {
            content: "";

            position: absolute;

            right: 0;
            bottom: 0;

            width: 38px;
            height: 2px;

            background: var(--green-dark);
        }

        /* Numbers */

        .number {
            font-size: 65px;

            font-weight: 800;

            line-height: 1;

            color: #dce1de;

            font-variant-numeric: tabular-nums;

            text-shadow:
                0 1px 0 #ffffff,
                0 0 12px rgba(60, 255, 114, 0.25),
                0 0 30px rgba(60, 255, 114, 0.12);
        }

        .label {
            margin-top: 13px;

            font-size: 9px;

            font-weight: 600;

            letter-spacing: 4px;

            color: #67716b;

            text-transform: uppercase;
        }

        /* =========================================
           SYSTEM STATUS
        ========================================= */

        .system {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-top: 30px;

            font-size: 8px;

            font-weight: 500;

            letter-spacing: 3px;

            color: #414b45;

            text-transform: uppercase;
        }

        .system::before,
        .system::after {
            content: "";

            width: 35px;
            height: 1px;

            background: #29322d;
        }

        .system strong {
            color: #617069;
        }

        /* =========================================
           SCANLINES
        ========================================= */

        .scanlines {
            position: fixed;

            inset: 0;

            z-index: 15;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 4px,
                    rgba(60, 255, 114, 0.015) 5px
                );
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes titleBreath {
            0%,
            100% {
                filter: brightness(0.95);
            }

            50% {
                filter: brightness(1.08);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .hud {
                inset: 15px;
            }

            .emblem {
                width: 300px;
                height: 390px;
            }

            .title {
                font-size: 42px;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 8px;
                letter-spacing: 3px;
            }

            .divider {
                margin-top: 22px;
            }

            .timer {
                gap: 6px;
                margin-top: 24px;
            }

            .time-box {
                min-width: 74px;
                padding: 14px 5px 12px;
            }

            .number {
                font-size: 37px;
            }

            .label {
                font-size: 7px;
                letter-spacing: 2px;
            }

            .system {
                font-size: 6px;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 400px) {

            .title {
                font-size: 36px;
            }

            .timer {
                gap: 4px;
            }

            .time-box {
                min-width: 68px;
            }

            .number {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

    <div class="atmosphere"></div>

    <div class="emblem"></div>

    <div class="hud"></div>

    <div class="content">

        <div class="status">
            <span class="status-dot"></span>
            Latveria Network Online
        </div>

        <div class="title">
            <span>DOOM</span> IS COMING
        </div>

        <div class="subtitle">
            December 18, 2026
        </div>

        <div class="divider">
            <span></span>
            <i></i>
            <span></span>
        </div>

        <div class="timer">

            <div class="time-box">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>

            <div class="time-box">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>

            <div class="time-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Minutes</div>
            </div>

            <div class="time-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Seconds</div>
            </div>

        </div>

        <div class="system">
            <strong>DOOM PROTOCOL</strong>
            <span>•</span>
            <span>Approaching</span>
        </div>

    </div>

    <div class="scanlines"></div>

    <script>
        const targetDate =
            new Date("2026-12-18T00:00:00").getTime();

        function updateCountdown() {

            const now = new Date().getTime();

            const distance = targetDate - now;

            if (distance <= 0) {

                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";

                return;
            }

            const days =
                Math.floor(
                    distance / (1000 * 60 * 60 * 24)
                );

            const hours =
                Math.floor(
                    (distance % (1000 * 60 * 60 * 24))
                    / (1000 * 60 * 60)
                );

            const minutes =
                Math.floor(
                    (distance % (1000 * 60 * 60))
                    / (1000 * 60)
                );

            const seconds =
                Math.floor(
                    (distance % (1000 * 60))
                    / 1000
                );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
